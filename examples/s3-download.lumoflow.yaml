apiVersion: lumorpa.io/v1
kind: Flow
metadata:
  id: s3-download-demo
  name: 从 S3 兼容存储下载对象
  description: |
    F-6 示例:用 s3.get 从 S3 兼容对象存储(AWS S3 / MinIO / 阿里云 OSS)下载
    一个对象到本地。endpoint 用自定义地址即可对接 MinIO/OSS;凭据走 vault,
    flow 里只写 ${{ vault.* }} 占位,VM 在动作执行前解析,密钥从不落 YAML。
  tags: [example, s3, transfer, F-6]
spec:
  # 声明用到的 vault 名:对应 LUMO_VAULT_S3_ACCESS_KEY / LUMO_VAULT_S3_SECRET_KEY
  # 环境变量,或 `lumo vault add s3` 写入加密库。
  vault: ["s3"]

  inputs:
    - { name: endpoint, type: string, default: "https://s3.us-east-1.amazonaws.com" }
    - { name: bucket,   type: string, default: "my-bucket" }
    - { name: key,      type: string, default: "reports/2024.csv" }
    - { name: out_path, type: file,   default: "/tmp/2024.csv" }

  capabilities:
    # gate 远端 host(s3.get 在连接前用 endpoint host 校验 network)。
    network: ["s3.us-east-1.amazonaws.com"]
    # gate 下载目标(s3.get 写本地前校验 fs.write)。
    fs.write: ["/tmp/**"]

  triggers:
    - kind: manual

  steps:
    - id: fetch
      action: s3.get
      with:
        endpoint: "{{ inputs.endpoint }}"
        region: "us-east-1"
        bucket: "{{ inputs.bucket }}"
        key: "{{ inputs.key }}"
        access_key: "${{ vault.s3.access_key }}"
        secret_key: "${{ vault.s3.secret_key }}"
        local_path: "{{ inputs.out_path }}"

    - id: report
      action: control.log
      with:
        message: "downloaded ${{ steps.fetch.result.bytes }} bytes to ${{ steps.fetch.result.local_path }}"
