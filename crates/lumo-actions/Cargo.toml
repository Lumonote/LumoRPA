[package]
name = "lumo-actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LumoRPA built-in actions (control/data/file/http/excel/browser)"

[dependencies]
lumo-core.workspace = true
lumo-dsl.workspace = true

tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
sha2.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
sqlx.workspace = true

reqwest.workspace = true
chromiumoxide.workspace = true
calamine.workspace = true
rust_xlsxwriter.workspace = true
arboard = { version = "3", default-features = false }
base64 = "0.22"
# util.url_encode / util.url_decode:percent-encoding 为 servo 系纯 Rust 微件
# (url crate 的组成部分,已是本 workspace 经 reqwest/url 的传递依赖,锁定
# 2.3.2,零新增编译单元成本),无 C 依赖,MSRV 无忧。
percent-encoding = "2.3"
bytes = "1"
hmac = "0.12"
regex = "1"
md-5 = "0.10"
sha1 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# string.encode_convert:UTF-8 ⇄ GBK/GB18030/Big5 等中文编码互转。encoding_rs 为
# 纯 Rust(Mozilla,MPL-2.0/Apache-2.0),无 C 依赖,信创/aarch64/loongarch 交叉友好。
encoding_rs = "0.8"

# F-3 email 动作:SMTP(lettre)+ IMAP(async-imap)。统一走 rustls + ring,避开
# openssl/native-tls 的 C 依赖,满足信创/跨平台交叉编译。lettre 0.11.22 起 MSRV
# 升到 1.85 > 本仓 1.83,锁定 0.11.19。其传递依赖 psm(经 chumsky→stacker)自
# 0.1.30 起 build-dep ar_archive_writer 0.5(edition 2024,需 rustc ≥1.85),
# Cargo.lock 已钉 psm =0.1.26;不要对 psm 盲目 cargo update(同 hashify 先例)。
lettre = { version = "=0.11.19", default-features = false, features = [
    "builder",
    "smtp-transport",
    "pool",
    "hostname",
    "tokio1-rustls",
    "ring",
    "rustls-native-certs",
] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# email.fetch 正文/附件:mail-parser 解析 IMAP 取回的 RFC822 字节(multipart、
# 常见中文字符集)。纯 Rust,无 C 依赖(信创红线),版本注释见 workspace Cargo.toml。
mail-parser.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
futures-util = "0.3"

# F-4 PDF 动作:纯 Rust lopdf(MIT)读写一体,无 C 依赖。lopdf 0.40 需 rustc 1.85
# > 本仓 1.83,锁 0.36。
lopdf = { version = "0.36", default-features = false }

# F-6 远程传输:FTP 走 suppaftp(tokio + tokio-rustls-ring,纯 Rust);S3 兼容存储
# 不引第三方 SDK(rust-s3/aws-creds 经 attohttpc 强拉 aws-lc-sys 这个 C 依赖,破坏
# aarch64 信创交叉编译),改用 workspace 既有 reqwest(rustls/ring)自签 AWS SigV4
# (复用本 crate 的 hmac/sha2),零新增重依赖,见 transfer/sigv4.rs。
suppaftp = { version = "8", default-features = false, features = ["tokio", "tokio-rustls-ring"] }

# 批次B docx.* 动作:.docx 即 zip(OOXML),复用本 crate 既有的纯 Rust `zip`
# 解出 word/document.xml,按 <w:t> 文本抽取 / {{占位符}}套打回写 —— 不引
# docx-rs(其拉入 image 重子树),零新增 C 依赖,信创/交叉友好。见 docx.rs 头注。
# 批次B system.process_list:纯 Rust sysinfo(无 -sys C 依赖,libc/
# core-foundation-sys 仅为 OS 符号声明绑定,build.rs 只做 cfg 探测、不编译 C,
# 信创/aarch64/loongarch 交叉友好)。仅启用 `system` 特性(进程/内存),裁掉
# disk/network/component(windows-bindings)/user/multithread,缩小依赖面。
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# F-2 图像/模板匹配:纯 Rust image + imageproc(均 MIT,无 C 依赖,信创/交叉友好)。
# 仅做图像/模板匹配;OCR 文本识别暂缓(目标中文,当前无准确的纯 Rust 中文 OCR)。
# image features 收窄到常用编码(png 覆盖 browser.screenshot 产物)。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
imageproc = { version = "0.25", default-features = false }

# F-1 桌面输入自动化:rdev 模拟鼠标/键盘事件。**默认关闭**(feature `desktop`)——
# 桌面输入必须调用 OS 级 C API(macOS CGEvent / Linux XTest / Windows SendInput),
# 无纯 Rust 替代,故不进信创核心默认构建;实际桌面端(Tauri/CLI)按需开启。
rdev = { version = "0.5", optional = true }
# 指令集缺口 P0:原生截屏 + 窗口枚举/几何(desktop.screenshot / window.*)。xcap 一库
# 覆盖 macOS(CoreGraphics)/ Windows(GDI)/ Linux(X11 + Wayland portal)三平台。
# 钉 =0.5.1:xcap 自 0.6.0 起改 edition 2024(需 rustc ≥1.85 > 本仓 MSRV 1.83),
# 0.5.1 是最后的 edition 2021 版 —— 不要盲目 cargo update(同 mail-parser/hashify
# 钉版先例)。Linux 侧传递 pipewire/xcb 等 C 依赖,与 rdev 同理只活在默认关闭的
# desktop feature 内,不触信创纯 Rust 红线。
xcap = { version = "=0.5.1", optional = true }
umya-spreadsheet = { workspace = true }

# xml.* 指令族(SOAP/政企对接/电子发票):
# - xml.parse / xml.build 用 quick-xml 流式解析与转义(版本注释见 workspace Cargo.toml,
#   不解析 DTD/外部实体,XXE 不可能)。
# - xml.xpath 用 sxd-document + sxd-xpath(XPath 1.0,纯 Rust,依赖仅 peresil/typed-arena,
#   无 C 依赖;edition 2018,在 rustc 1.83 可编译——两 crate 自 2020 起 API 冻结但功能完整,
#   谓词/轴/函数库齐全,远优于自实现路径子集)。若未来维护性恶化,降级方案是自实现
#   `/a/b[2]/@id` 简化子集,见 xml_ops.rs 头注。
quick-xml.workspace = true
sxd-document = "0.3"
sxd-xpath = "0.4"

[features]
# 桌面输入动作族 desktop.*(rdev)。默认关闭 —— 信创/headless 交叉编译不受影响,
# 文本输入走剪贴板粘贴(arboard,Unicode/中文安全)。同特性还启用原生截屏
# desktop.screenshot 与窗口管理 window.*(xcap;Windows 激活/改几何走 windows-sys)。
desktop = ["dep:rdev", "dep:xcap", "dep:windows-sys"]

# window.activate / window.bounds set 的 Windows 实现(SetForegroundWindow /
# MoveWindow)。windows-sys 仅是 Win32 符号声明(官方,不编译 C),其余平台不参与。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# X-07 artifacts e2e(browser_actions.rs 的 --ignored 用例)需要直查 artifacts 表。
lumo-storage.workspace = true
tempfile.workspace = true
serde_yaml.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
