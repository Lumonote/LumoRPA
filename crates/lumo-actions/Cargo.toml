[package]
name = "lumo-actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LumoRPA built-in actions (control/data/file/http/excel/browser)"

[dependencies]
lumo-core.workspace = true
lumo-dsl.workspace = true

tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
# preserve_order:兼容族(dictionary.*)与 JSON 往返都必须保留**键插入序** ——
# 「字典」的键序就是用户添加顺序,默认的 BTreeMap 后端会按字典序重排,
# 让 dictionary.get_keys / json.* 的输出与用户预期不符。indexmap 已是本仓
# 传递依赖(lumo-agent 同款配置、Cargo.lock 已锁 2.14.0),零新增依赖树。
serde_json = { workspace = true, features = ["preserve_order"] }
schemars.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
sha2.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
sqlx.workspace = true

reqwest.workspace = true
chromiumoxide.workspace = true
calamine.workspace = true
libloading = { version = "0.8", optional = true }
lumo-doc.workspace = true
rust_xlsxwriter.workspace = true
arboard = { version = "3", default-features = false }
base64 = "0.22"
# util.url_encode / util.url_decode:percent-encoding 为 servo 系纯 Rust 微件
# (url crate 的组成部分,已是本 workspace 经 reqwest/url 的传递依赖,锁定
# 2.3.2,零新增编译单元成本),无 C 依赖,MSRV 无忧。
percent-encoding = "2.3"
bytes = "1"
hmac = "0.12"
regex = "1"
md-5 = "0.10"
sha1 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate", "aes-crypto"] }
# string.encode_convert:UTF-8 ⇄ GBK/GB18030/Big5 等中文编码互转。encoding_rs 为
# 纯 Rust(Mozilla,MPL-2.0/Apache-2.0),无 C 依赖,信创/aarch64/loongarch 交叉友好。
encoding_rs = "0.8"

# F-3 email 动作:SMTP(lettre)+ IMAP(async-imap)。统一走 rustls + ring,避开
# openssl/native-tls 的 C 依赖,满足信创/跨平台交叉编译。
# 钉版 =0.11.19 已解开:该版受 RUSTSEC-2026-0141 影响(boring-tls 集成里
# hostname 校验被反了的布尔值静默关闭)。本仓并未启用 boring-tls(只开
# rustls/ring,TLS 后端见下列 features),所以它不是可利用路径 —— 但 cargo-deny
# 的 [graph] all-features = true 会按"该版本存在该缺陷"判定,且留着钉版等于把
# 一棵已知有缺陷的树长期留在 lock 里。0.11.23 修掉该问题,MSRV 1.85 ≤ 本仓 1.88。
# 其传递依赖 psm(经 chumsky→stacker)自 0.1.30 起 build-dep ar_archive_writer 0.5
# (edition 2024);Cargo.lock 仍钉 psm =0.1.26,不要在无关改动中盲目 cargo
# update(同 hashify 先例)。
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "smtp-transport",
    "pool",
    "hostname",
    "tokio1-rustls",
    "ring",
    "rustls-native-certs",
] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# email.fetch 正文/附件:mail-parser 解析 IMAP 取回的 RFC822 字节(multipart、
# 常见中文字符集)。纯 Rust,无 C 依赖(信创红线),版本注释见 workspace Cargo.toml。
mail-parser.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
futures-util = "0.3"

# F-4 PDF 动作:纯 Rust lopdf(MIT)读写一体,无 C 依赖。
# 0.36 -> 0.45:0.36 受 RUSTSEC-2026-0187 影响(load_mem 对嵌套数组/字典无界递归,
# 约 21KB 的构造 PDF 就能把栈打爆成 SIGABRT —— 不是 panic,捕获不住,任何解析
# 不可信 PDF 的进程都可被远程打死)。修复落在 0.42.0;这里取 0.45.0(MSRV 1.88,
# 与本仓 rust-version 正好一致),而不是贴着 0.42 的底线,理由是少留一次后续
# 升级债。API 侧的适配见 pdf_ops.rs。
lopdf = { version = "0.45", default-features = false }

# F-6 远程传输:FTP 走 suppaftp(tokio + tokio-rustls-ring,纯 Rust);S3 兼容存储
# 不引第三方 SDK(rust-s3/aws-creds 经 attohttpc 强拉 aws-lc-sys 这个 C 依赖,破坏
# aarch64 信创交叉编译),改用 workspace 既有 reqwest(rustls/ring)自签 AWS SigV4
# (复用本 crate 的 hmac/sha2),零新增重依赖,见 transfer/sigv4.rs。
# 版本 8 -> 12:8.0.3 受 RUSTSEC-2026-0271(FTP CRLF 命令注入,影响 login/cwd/retr/
# put_file 等所有接受字符串参数的方法)影响,修复出现在 >= 10.0.2;10.0.2 起的每个
# 版本都声明 rust-version 1.88,故本仓 MSRV 相应从 1.83 提到 1.88(见根 Cargo.toml)。
# 12.0.0 另有破坏性改动:finalize_retr_stream 被移除,retr_as_stream 返回
# TransferStream 并改用其 .finish()(见 transfer.rs 的 download_via)。
# 仍走 tokio + tokio-rustls-ring:纯 Rust、ring 后端,不引 native-tls/openssl,
# 保持 aarch64 信创交叉编译无 C-TLS 依赖。
suppaftp = { version = "12", default-features = false, features = ["tokio", "tokio-rustls-ring"] }

# 批次B docx.* 动作:.docx 即 zip(OOXML),复用本 crate 既有的纯 Rust `zip`
# 解出 word/document.xml,按 <w:t> 文本抽取 / {{占位符}}套打回写 —— 不引
# docx-rs(其拉入 image 重子树),零新增 C 依赖,信创/交叉友好。见 docx.rs 头注。
# 批次B system.process_list:纯 Rust sysinfo(无 -sys C 依赖,libc/
# core-foundation-sys 仅为 OS 符号声明绑定,build.rs 只做 cfg 探测、不编译 C,
# 信创/aarch64/loongarch 交叉友好)。仅启用 `system` 特性(进程/内存),裁掉
# disk/network/component(windows-bindings)/user/multithread,缩小依赖面。
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# F-2 图像/模板匹配:纯 Rust image + imageproc(均 MIT,无 C 依赖,信创/交叉友好)。
# 仅做图像/模板匹配;OCR 文本识别暂缓(目标中文,当前无准确的纯 Rust 中文 OCR)。
# image features 收窄到常用编码(png 覆盖 browser.screenshot 产物)。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
imageproc = { version = "0.25", default-features = false }

# F-1 桌面输入自动化:rdev 模拟鼠标/键盘事件。**默认关闭**(feature `desktop`)——
# 桌面输入必须调用 OS 级 C API(macOS CGEvent / Linux XTest / Windows SendInput),
# 无纯 Rust 替代,故不进信创核心默认构建;实际桌面端(Tauri/CLI)按需开启。
rdev = { version = "0.5", optional = true }
# 指令集缺口 P0:原生截屏 + 窗口枚举/几何(desktop.screenshot / window.*)。xcap 一库
# 覆盖 macOS(CoreGraphics)/ Windows(GDI)/ Linux(X11 + Wayland portal)三平台。
# 钉 =0.5.1:xcap 自 0.6.0 起改 edition 2024,0.5.1 是最后的 edition 2021 版。
# 当初为守 MSRV 1.83 而钉;MSRV 现为 1.88,edition 2024 已不再是障碍,但升级
# 0.6+ 需验证 API 变更,故保留钉版 —— 不要盲目 cargo update(同 mail-parser/
# hashify 钉版先例)。Linux 侧传递 pipewire/xcb 等 C 依赖,与 rdev 同理只活在默认关闭的
# desktop feature 内,不触信创纯 Rust 红线。
xcap = { version = "=0.5.1", optional = true }
umya-spreadsheet = { workspace = true }

# xml.* 指令族(SOAP/政企对接/电子发票):
# - xml.parse / xml.build 用 quick-xml 流式解析与转义(版本注释见 workspace Cargo.toml,
#   不解析 DTD/外部实体,XXE 不可能)。
# - xml.xpath 用 sxd-document + sxd-xpath(XPath 1.0,纯 Rust,依赖仅 peresil/typed-arena,
#   无 C 依赖;edition 2018,在本仓 MSRV 1.88 上可编译——两 crate 自 2020 起 API 冻结但功能完整,
#   谓词/轴/函数库齐全,远优于自实现路径子集)。若未来维护性恶化,降级方案是自实现
#   `/a/b[2]/@id` 简化子集,见 xml_ops.rs 头注。
quick-xml.workspace = true
sxd-document = "0.3"
sxd-xpath = "0.4"

[features]
# 本地小 OCR 模型:libloading 运行时加载 ONNX Runtime(同 lumo-voice 的
# sherpa-native 范式),不编译期链接 C 库,默认构建仍是纯 Rust。
ocr-native = ["dep:libloading"]
# 桌面输入动作族 desktop.*(rdev)。默认关闭 —— 信创/headless 交叉编译不受影响,
# 文本输入走剪贴板粘贴(arboard,Unicode/中文安全)。同特性还启用原生截屏
# desktop.screenshot 与窗口管理 window.*(xcap;Windows 激活/改几何走 windows-sys)。
desktop = ["dep:rdev", "dep:xcap", "dep:windows-sys"]

# window.activate / window.bounds set 的 Windows 实现(SetForegroundWindow /
# MoveWindow)。windows-sys 仅是 Win32 符号声明(官方,不编译 C),其余平台不参与。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# X-07 artifacts e2e(browser_actions.rs 的 --ignored 用例)需要直查 artifacts 表。
lumo-storage.workspace = true
tempfile.workspace = true
serde_yaml.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
