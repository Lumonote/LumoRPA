name: release

# Two-channel release pipeline. One workflow, two ways to get installable
# software out of it:
#
#   * main branch  -> a ROLLING PRE-RELEASE tagged `dev-latest`. Every push to
#     main rebuilds the desktop installers for all platforms and republishes
#     them at one stable URL:
#       https://github.com/<owner>/<repo>/releases/download/dev-latest/<file>
#     These are UNOFFICIAL, UNSIGNED development builds — a convenient snapshot
#     for testing, not a supported release. The build still runs the full
#     production gate below, so a red gate means no dev-latest is published.
#   * v* tag       -> a real GitHub Release, exactly as before, with signed and
#     (on macOS) notarized artifacts. Tag builds additionally REQUIRE the Apple
#     signing / notarization and Tauri updater secrets, and a tag without them
#     fails closed rather than shipping an unsigned "release".
#
# The sign/notarize assertion is deliberately tag-only for that reason: main
# pushes carry no signing secrets, so requiring them there would turn every main
# build red without producing a single extra installer. Unsigned main builds
# rely on scripts/build-desktop.sh skipping updater artifacts when
# LUMO_UPDATER_PUBKEY is empty (no .sig files, no broken auto-update manifest).
#
# For each platform the pipeline produces BOTH the desktop installer
# (build-desktop.sh → cargo tauri) and the CLI archive (package-cli.sh) through
# one entry point, scripts/package-release.sh, which sequences the pair against a
# single target directory and fails closed unless both halves are produced.
# loongarch64 is the exception: it ships a CLI archive only (no desktop), so it
# calls package-cli.sh directly.
#
# NOTE (honest limitation): the Windows / Linux / loongarch64 packages cannot be
# built or verified on a macOS dev machine — each Tauri bundler needs the target
# OS's own WebKit/GTK + native bundler (the same reason ci.yml's cross-check only
# runs `cargo check --exclude lumorpa-desktop`). This file is validated for
# syntax locally; its cross-platform jobs are first exercised by a real push on
# GitHub-hosted runners.
#
# Windows and macOS are the priority targets: Windows emits BOTH the NSIS .exe
# and the .msi (they can share a basename, so staging keeps them distinct), and
# macOS emits a universal .dmg plus the .app staging tree.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Collapse superseded builds per ref, but never cancel a tag build: a release
# that has started must be allowed to finish, while yesterday's dev-latest run
# is disposable.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # softprops/action-gh-release creates/updates releases

env:
  CARGO_TERM_COLOR: always
  # One artifact path per channel: real releases keep 90 days (auditable), while
  # rolling dev snapshots are superseded within hours and are dropped at 14.
  ARTIFACT_RETENTION_DAYS: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

jobs:
  production-gate:
    name: Production agent gates
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Verify agent, voice, security and recovery
        run: |
          cargo test -p lumo-storage -p lumo-agent -p lumo-voice
          cargo test -p lumo-voice --features sherpa-native --test sherpa_native
          cargo test -p lumorpa-desktop --lib
          cargo clippy -p lumo-agent -p lumo-voice -p lumorpa-desktop --all-targets -- -D warnings
      - name: Verify Mission Control and desktop surfaces
        working-directory: apps/desktop/frontend
        run: |
          npm ci
          npm test
          npm run lint
      # TAG-ONLY on purpose. main pushes have no signing secrets; asserting
      # them there would turn every main build red — and produce nothing.
      - name: Require macOS signing and notarization secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUMO_UPDATER_PUBKEY: ${{ secrets.LUMO_UPDATER_PUBKEY }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          # Without the pubkey the bundler silently skips updater artifacts, so a
          # tagged release would ship without .sig files and break auto-update.
          test -n "$LUMO_UPDATER_PUBKEY"

  macos:
    name: macOS (universal · Intel + Apple Silicon)
    needs: production-gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (+ both macOS arches)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      # Desktop installer + CLI archive in one step: both halves share a single
      # dependency resolve and target directory, and the step fails closed if
      # either half is missing. See scripts/package-release.sh.
      - name: Package (universal .dmg + CLI archive)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUMO_UPDATER_PUBKEY: ${{ secrets.LUMO_UPDATER_PUBKEY }}
        run: scripts/package-release.sh universal-apple-darwin app,dmg
      # Every copy is `cp -n` (no-clobber) and every find gets `-type f`, so two
      # sources that happen to share a basename cannot silently overwrite one
      # another. The closing assertion fails the job if the staging directory is
      # empty, so a broken glob can never be masked by a green upload step.
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp -n dist/lumorpa-*-darwin-universal.tar.gz out/ 2>/dev/null || true
          find target/universal-apple-darwin/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -exec cp -n {} out/ \;
          test -n "$(ls -A out)" || { echo "error: macOS staging produced no artifacts" >&2; exit 1; }
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: lumorpa-macos-universal
          path: out/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
      - name: Summarize artifacts
        run: |
          {
            echo "### macOS (universal · Intel + Apple Silicon)"
            echo
            echo "| Artifact | Size |"
            echo "| --- | ---: |"
            find out -type f -exec sh -c 'printf "| \`%s\` | %s |\n" "$(basename "$1")" "$(du -h "$1" | cut -f1)"' _ {} \; | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  windows:
    name: Windows (x86_64)
    needs: production-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      # Desktop installer + CLI archive in one step (see scripts/package-release.sh).
      - name: Package (.exe NSIS + .msi + CLI archive)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUMO_UPDATER_PUBKEY: ${{ secrets.LUMO_UPDATER_PUBKEY }}
        shell: bash
        run: scripts/package-release.sh x86_64-pc-windows-msvc nsis,msi
      # Windows is a priority target, so the NSIS .exe and the .msi are staged
      # through SEPARATE find passes. Tauri's WiX output and its NSIS output can
      # carry the SAME basename, so a single flat find|cp could keep only one of
      # them; `cp -n` (no-clobber) plus the assertions at the end make the job
      # fail loudly instead of publishing a Release with one installer.
      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp -n dist/lumorpa-*-windows-*.zip out/ 2>/dev/null || true
          find target/x86_64-pc-windows-msvc/release/bundle/nsis -type f \
            \( -name '*.exe' -o -name '*.zip' -o -name '*.sig' \) -exec cp -n {} out/ \;
          find target/x86_64-pc-windows-msvc/release/bundle/msi -type f \
            \( -name '*.msi' -o -name '*.zip' -o -name '*.sig' \) -exec cp -n {} out/ \;
          test -n "$(ls -A out)" || { echo "error: Windows staging produced no artifacts" >&2; exit 1; }
          ls -l out
          test -n "$(find out -maxdepth 1 -name '*.exe' -print -quit)" || {
            echo "error: no NSIS .exe staged" >&2; exit 1; }
          test -n "$(find out -maxdepth 1 -name '*.msi' -print -quit)" || {
            echo "error: no .msi staged" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: lumorpa-windows-x86_64
          path: out/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
      - name: Summarize artifacts
        shell: bash
        run: |
          {
            echo "### Windows (x86_64)"
            echo
            echo "| Artifact | Size |"
            echo "| --- | ---: |"
            find out -type f -exec sh -c 'printf "| \`%s\` | %s |\n" "$(basename "$1")" "$(du -h "$1" | cut -f1)"' _ {} \; | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  linux-x64:
    name: Linux (x86_64 · deb/rpm/AppImage)
    needs: production-gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GTK/WebKit for Tauri, plus the X11/xcb/pipewire and ALSA headers that
      # lumo-actions' `desktop` feature (rdev/xcap) and lumo-voice's `capture`
      # feature (cpal) need. Shared with ci.yml so the two lists cannot drift.
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      # Desktop installer + CLI archive in one step (see scripts/package-release.sh).
      - name: Package (.deb / .rpm / AppImage + CLI archive)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUMO_UPDATER_PUBKEY: ${{ secrets.LUMO_UPDATER_PUBKEY }}
        run: scripts/package-release.sh "" deb,rpm,appimage
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp -n dist/lumorpa-*-linux-*.tar.gz out/ 2>/dev/null || true
          find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.sig' \) \
            -exec cp -n {} out/ \;
          test -n "$(ls -A out)" || { echo "error: Linux x86_64 staging produced no artifacts" >&2; exit 1; }
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: lumorpa-linux-x86_64
          path: out/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
      - name: Summarize artifacts
        run: |
          {
            echo "### Linux (x86_64 · deb/rpm/AppImage)"
            echo
            echo "| Artifact | Size |"
            echo "| --- | ---: |"
            find out -type f -exec sh -c 'printf "| \`%s\` | %s |\n" "$(basename "$1")" "$(du -h "$1" | cut -f1)"' _ {} \; | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  linux-arm64:
    name: Linux (aarch64 · 麒麟 ARM 基线)
    needs: production-gate
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GTK/WebKit for Tauri, plus the X11/xcb/pipewire and ALSA headers that
      # lumo-actions' `desktop` feature (rdev/xcap) and lumo-voice's `capture`
      # feature (cpal) need. Shared with ci.yml so the two lists cannot drift.
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      # Desktop installer + CLI archive in one step (see scripts/package-release.sh).
      - name: Package (.deb / .rpm + CLI archive)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUMO_UPDATER_PUBKEY: ${{ secrets.LUMO_UPDATER_PUBKEY }}
        run: scripts/package-release.sh "" deb,rpm
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp -n dist/lumorpa-*-linux-*.tar.gz out/ 2>/dev/null || true
          find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.sig' \) -exec cp -n {} out/ \;
          test -n "$(ls -A out)" || { echo "error: Linux aarch64 staging produced no artifacts" >&2; exit 1; }
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: lumorpa-linux-aarch64
          path: out/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
      - name: Summarize artifacts
        run: |
          {
            echo "### Linux (aarch64 · 麒麟 ARM 基线)"
            echo
            echo "| Artifact | Size |"
            echo "| --- | ---: |"
            find out -type f -exec sh -c 'printf "| \`%s\` | %s |\n" "$(basename "$1")" "$(du -h "$1" | cut -f1)"' _ {} \; | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  loongarch64:
    name: loongarch64 (龙芯 · best-effort CLI)
    needs: production-gate
    runs-on: ubuntu-22.04
    continue-on-error: true # no GitHub-hosted loong runner; informational only
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: loongarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-loongarch64-linux-gnu
      # GitHub has no loongarch64 runner and the Tauri bundler needs the target's
      # own GTK/WebKit, so only the CLI is cross-built — a best-effort convenience
      # binary. A full desktop package needs a native 麒麟/龙芯 or QEMU
      # self-hosted runner. ring/rusqlite compile C for the target, so the cross
      # CC must be wired in via cc-crate's per-triple env (mirrors ci.yml).
      #
      # LUMO_CLI_CARGO_FEATURES drops lumo-cli's default-on `hotkey-rdev`
      # feature. rdev reaches X11 through pkg-config, which cannot resolve for a
      # foreign target here (no loongarch64 sysroot on the runner), so the global
      # hotkey backend falls back to its stub. That is an honest limitation of
      # this convenience build, not a silent one; a native 龙芯 build keeps the
      # real backend.
      - name: Package CLI (cross)
        env:
          CROSS_CC: loongarch64-linux-gnu-gcc-14
          LUMO_CLI_CARGO_FEATURES: --no-default-features
        run: |
          export CC_loongarch64_unknown_linux_gnu="$CROSS_CC"
          export CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER="$CROSS_CC"
          scripts/package-cli.sh loongarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: lumorpa-linux-loongarch64
          path: dist/lumorpa-*-linux-loongarch64.tar.gz
          # Intentionally `warn`, not `error`: this job is continue-on-error and
          # has no real runner, so its absence must not fail the release. The
          # publish job below likewise tolerates its absence.
          if-no-files-found: warn
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
      - name: Summarize artifacts
        run: |
          {
            echo "### loongarch64 (龙芯 · best-effort CLI)"
            echo
            if ls dist/lumorpa-*-linux-loongarch64.tar.gz >/dev/null 2>&1; then
              echo "| Artifact | Size |"
              echo "| --- | ---: |"
              for f in dist/lumorpa-*-linux-loongarch64.tar.gz; do
                printf '| \`%s\` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
              done
            else
              echo "_No loongarch64 CLI archive produced (expected: no hosted runner for this target)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lumorpa-*-linux-loongarch64.tar.gz

  # MAIN CHANNEL. Runs only for branch pushes (i.e. main), never for tags: on a
  # tag every platform job has already attached its own files to the real
  # Release. This job collects the same artifacts into ONE rolling pre-release so
  # a main push always leaves behind a stable, downloadable URL rather than only
  # an expiring CI artifact.
  publish-dev:
    name: Publish rolling dev-latest pre-release
    needs: [production-gate, macos, windows, linux-x64, linux-arm64, loongarch64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          # `pattern: lumorpa-*` matches every platform artifact by name;
          # merge-multiple flattens them all into one flat staging directory.
          pattern: lumorpa-*
          merge-multiple: true
          path: dev-assets
      - name: Verify we actually have installers
        run: |
          set -euo pipefail
          ls -lR dev-assets
          test -n "$(find dev-assets -maxdepth 1 -type f -print -quit)" || {
            echo "error: no artifacts were merged; refusing to publish an empty pre-release" >&2
            exit 1
          }
          # The user-visible promise is "there is an installer to download", so
          # assert at least one Windows and one macOS payload survived the merge.
          test -n "$(find dev-assets -maxdepth 1 \( -name '*.exe' -o -name '*.msi' \) -print -quit)" || {
            echo "error: no Windows installer (.exe/.msi) in dev-assets" >&2; exit 1; }
          test -n "$(find dev-assets -maxdepth 1 -name '*.dmg' -print -quit)" || {
            echo "error: no macOS .dmg in dev-assets" >&2; exit 1; }
      - name: Summarize downloads
        run: |
          {
            echo "## LumoRPA dev-latest (unofficial build)"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "| Type | Artifact | Size |"
            echo "| --- | --- | ---: |"
            find dev-assets -maxdepth 1 -type f -exec sh -c 'printf "| %s | \`%s\` | %s |\n" "$(basename "$1" | sed -E "s/.*\.(exe|msi|dmg|deb|rpm|AppImage|zip|tar\.gz)$/\1/")" "$(basename "$1")" "$(du -h "$1" | cut -f1)"' _ {} \; | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: LumoRPA dev-latest (unofficial, unsigned)
          prerelease: true
          make_latest: false
          files: dev-assets/*
          body: |

            > **UNOFFICIAL, UNSIGNED DEVELOPMENT BUILD — NOT A RELEASE.**
            >
            > These installers are built automatically from the tip of `main`
            > on every push. They are **not signed, not notarized, and not
            > verified**. macOS will show a Gatekeeper warning and Windows will
            > show a SmartScreen warning — that is expected.
            > For a supported build, use a versioned release instead.

            Rolling development snapshot of `main`.

            - Commit: `${{ github.sha }}`
            - Built: run `${{ github.run_number }}` of workflow run `${{ github.run_id }}`
            - Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            This tag is **reused** on every main push: the URL is stable, the
            contents are replaced each time.

            | Platform | What to download |
            | --- | --- |
            | **Windows (priority)** | `*-setup.exe` (NSIS installer) or `*.msi` (WiX/MSI) |
            | **macOS (priority)** | `*.dmg` (universal: Intel + Apple Silicon) |
            | Linux x86_64 | `.deb`, `.rpm`, `.AppImage` |
            | Linux aarch64 | `.deb`, `.rpm` |
            | CLI | `lumorpa-*-cli-*.tar.gz` / `*.zip` per platform |

            Updater signatures (`.sig`) are intentionally absent from dev
            builds: `LUMO_UPDATER_PUBKEY` is empty on main, so
            `scripts/build-desktop.sh` skips updater artifacts rather than
            emitting a manifest that would point at unsigned payloads.

      - name: Job summary
        run: |
          {
            echo
            echo "**Published rolling pre-release \`dev-latest\`** (prerelease, not latest)."
            echo
            echo "Download page: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/dev-latest"
          } >> "$GITHUB_STEP_SUMMARY"
