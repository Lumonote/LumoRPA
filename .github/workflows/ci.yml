name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: ${{ matrix.os }} / rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Linux needs the platform C headers for the desktop shell, lumo-actions'
      # `desktop` feature and lumo-voice's `capture` feature; macOS/Windows use
      # Cocoa / CoreAudio / Win32 instead and need nothing. See the action for
      # the full list and rationale.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Build (workspace)
        run: cargo build --workspace --locked --all-targets
      - name: Test (workspace, excluding browser)
        env:
          # Don't try to launch Chrome on CI machines.
          LUMO_SKIP_BROWSER_TESTS: "1"
        run: cargo test --workspace --locked --exclude lumo-actions -- --nocapture
      - name: Test (lumo-actions, incl. integration suites)
        env:
          # The one browser-dependent test is #[ignore]'d; this keeps any
          # future opt-in browser test from trying to launch Chrome on CI.
          LUMO_SKIP_BROWSER_TESTS: "1"
        run: cargo test -p lumo-actions --locked -- --nocapture
      # lumo-voice's `capture` feature is off by default (cpal → ALSA / WASAPI /
      # CoreAudio; see crates/lumo-voice/Cargo.toml), which also compiles out
      # tests/cpal_capture.rs — the file is #![cfg(feature = "capture")]. Running
      # it explicitly keeps the microphone-resampling tests in the suite instead
      # of silently dropping them. The Linux leg has the ALSA headers installed
      # above; macOS/Windows use CoreAudio/WASAPI and need nothing.
      - name: Test (lumo-voice microphone capture)
        run: cargo test -p lumo-voice --locked --features capture -- --nocapture
      - name: CLI smoke
        shell: bash
        run: |
          cargo run -p lumo-cli --locked -- --home "$RUNNER_TEMP/lumorpa" validate examples/hello-world.lumoflow.yaml
          cargo run -p lumo-cli --locked -- --home "$RUNNER_TEMP/lumorpa" validate examples/control-flow.lumoflow.yaml
          cargo run -p lumo-cli --locked -- --home "$RUNNER_TEMP/lumorpa" validate examples/excel-loop.lumoflow.yaml
          cargo run -p lumo-cli --locked -- --home "$RUNNER_TEMP/lumorpa" validate examples/skill-driver.lumoflow.yaml
          cargo run -p lumo-cli --locked -- --home "$RUNNER_TEMP/lumorpa" run --no-store examples/hello-world.lumoflow.yaml
          cargo run -p lumo-cli --locked -- --home "$RUNNER_TEMP/lumorpa" run --no-store examples/skill-driver.lumoflow.yaml

  fmt-clippy:
    # Audit note: this file mixes pinned and floating runner labels. The floaters
    # were `ubuntu-latest`, which is migrating from 24.04 to 26.04 during
    # 2026-10-19..2026-11-19; a silent base-image change can move compiler, glibc,
    # and apt package versions under a job that asserts exact toolchain behaviour.
    # Pinned to ubuntu-24.04 so the image only changes when this file says so —
    # raise it deliberately after testing, one job at a time.
    #
    # NOTE: scripts/check-runner-labels.sh (the last step of this job) *warns* on
    # floating labels like the ones above; it fails only on RETIRED labels. That
    # split is deliberate — do not "fix" the guard by making floats fatal, or it
    # will fail this file, which uses floats legitimately in build-test's matrix.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `clippy --workspace --all-targets` compiles the same tree `build-test`
      # does, so it needs the same Linux C headers.
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Static guard, not a build step: catches a retired runner label (e.g. the
      # retired macos-14, which fails jobs with an error that never says
      # "retired") before it reaches a runner. Also catches it in a matrix list
      # such as `os: [ubuntu-latest, macos-14, windows-latest]`, which is the
      # shape this bug actually took here. Floating labels are warned, not
      # failed — see the note on this job above.
      - name: Runner label guard
        run: scripts/check-runner-labels.sh

  coverage:
    name: coverage floor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Excluding lumorpa-desktop drops Tauri's GTK/WebKit, but *not* the Linux
      # C dependencies that come from lumo-actions' `desktop` feature (rdev/x11)
      # or lumo-voice's `capture` feature (cpal/alsa): cargo unifies features
      # workspace-wide, so those reach this build through lumo-cli even with the
      # desktop shell excluded.
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      # Browser/vision/selector actions need a real Chrome, the recorder drives
      # CDP, and the Tauri shell needs system webkit libs — none are reachable on
      # CI, so they're kept out of the coverage denominator. `--summary-only`
      # prints the real per-crate + TOTAL table; `--fail-under-lines` is a
      # deliberately-conservative ratchet (raise it toward the printed TOTAL as
      # coverage grows, never lower it).
      - name: Coverage floor (lib + integration, browser excluded)
        env:
          LUMO_SKIP_BROWSER_TESTS: "1"
        run: |
          cargo llvm-cov --workspace --locked \
            --exclude lumorpa-desktop \
            --ignore-filename-regex '(browser|vision|selectors)\.rs$|lumo-recorder/src' \
            --fail-under-lines 50 \
            --summary-only

  cargo-deny:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Runs advisories + bans + licenses + sources against deny.toml. The
      # action manages the RUSTSEC advisory-db checkout/cache for us.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Tracks the workspace `rust-version`. Raised from 1.83 to the smallest
      # floor the tree actually satisfies: clap_lex needs edition 2024 (Cargo
      # >= 1.85), icu_* 2.2.0 needs 1.86, and suppaftp needs 1.88 for the
      # FTP-injection fix. See the note in Cargo.toml. Keep in lockstep with it.
      - name: Install Rust 1.88 (declared rust-version)
        uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # Same reasoning as coverage: `--exclude lumorpa-desktop` does not remove
      # the feature-unified rdev/x11 and cpal/alsa dependencies.
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      # Compile the shipped library/binary code on the pinned MSRV. The Tauri
      # shell is excluded (its system-lib build is environment-specific, not a
      # portability concern); dev-only test deps are out of the MSRV contract,
      # so no --all-targets here.
      - name: cargo check on MSRV
        run: cargo check --workspace --locked --exclude lumorpa-desktop

  cross-check:
    name: cross check / ${{ matrix.target }}
    # Pinned, not `ubuntu-latest`. Two independent reasons:
    #   1. `ubuntu-latest` is migrating from 24.04 to 26.04 between 2026-10-19
    #      and 2026-11-19, and this job installs a cross C toolchain by exact
    #      apt name — a silent base-image change is exactly the kind of thing
    #      that turns a green job red for reasons unrelated to this repo.
    #   2. `gcc-14-loongarch64-linux-gnu` only exists from noble (24.04) onward.
    #      On jammy (22.04) apt cannot locate it at all; 24.04 is the version
    #      verified to carry it.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 (ARM 服务器/麒麟等): a hard gate — toolchain is readily available.
          - target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            best_effort: false
          # loongarch64 (龙芯/信创): best-effort — the cross C toolchain and
          # ring/libsqlite3-sys target support are still maturing on CI runners,
          # so a red result here is informational, not blocking.
          - target: loongarch64-unknown-linux-gnu
            apt: gcc-14-loongarch64-linux-gnu
            cc: loongarch64-linux-gnu-gcc-14
            best_effort: true
    continue-on-error: ${{ matrix.best_effort }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # A missing cross toolchain must SKIP, not fail. `continue-on-error`
      # already stops this job from blocking the build, but without this guard
      # the apt lookup failure is what CI reports — which reads like a repo
      # defect instead of "this informational check had nothing to run with".
      - name: Install cross C toolchain
        id: cross-cc
        run: |
          set -euo pipefail
          sudo apt-get update
          if sudo apt-get install -y ${{ matrix.apt }}; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a best-effort leg is allowed to degrade to a skip. For a hard
          # gate (aarch64), an uninstallable toolchain is a real failure:
          # silently skipping it would turn the gate green while checking
          # nothing, which is worse than the red it replaces.
          if [[ "${{ matrix.best_effort }}" == "true" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.apt }} is not installable on this image; skipping the best-effort ${{ matrix.target }} cross check."
          else
            echo "error: ${{ matrix.apt }} is required for the hard ${{ matrix.target }} gate but could not be installed." >&2
            exit 1
          fi
      # rusqlite (bundled SQLite) and ring (rustls) build C for the target, so
      # the cross C compiler must be wired in via cc-crate's CC_<triple> env.
      # Only the per-target var is set — clobbering host CC would break build
      # scripts/proc-macros that compile for the runner itself.
      #
      # --no-default-features is load-bearing here, not cosmetic. Two crates
      # keep their platform C dependencies behind a *default-on* feature:
      # lumo-cli's `hotkey-rdev` (rdev → X11 on Linux) and lumo-voice's
      # `capture` (cpal → ALSA). Both walk through pkg-config, which refuses to
      # use host .pc files for a foreign target ("pkg-config has not been
      # configured to support cross-compilation") — installing the host dev
      # packages cannot fix that, only a target sysroot would. Turning the
      # features off makes cargo check a pure-Rust cross build. The stubs that
      # replace them are already implemented: see the `#[cfg(not(feature =
      # "hotkey-rdev"))]` arm in crates/lumo-cli/src/cmd/hotkey.rs and the
      # `#[cfg(feature = "capture")]` gate in crates/lumo-voice/src/lib.rs.
      #
      # --exclude lumorpa-desktop drops the Tauri shell (its GTK/WebKit is a
      # host-only system-lib build). It does *not* by itself remove rdev/x11 —
      # that comes from lumo-cli, which the previous revision of this job
      # assumed it did.
      - name: cargo check (cross, desktop + native-only features excluded)
        # Guarded on the install step: if the cross C compiler is not present,
        # this check cannot mean anything and must skip rather than fail on a
        # linker/crate that is missing for environmental reasons.
        if: steps.cross-cc.outputs.available == 'true'
        env:
          TARGET: ${{ matrix.target }}
          CROSS_CC: ${{ matrix.cc }}
        run: |
          underscore="${TARGET//-/_}"
          export "CC_${underscore}=${CROSS_CC}"
          export "CARGO_TARGET_$(echo "$underscore" | tr '[:lower:]' '[:upper:]')_LINKER=${CROSS_CC}"
          cargo check --workspace --locked --exclude lumorpa-desktop \
            --no-default-features --target "$TARGET"

  # Cheap "can we still produce a downloadable file?" gate on the CLI packaging
  # path. This is deliberately CLI-ONLY: a full desktop bundle (Tauri + NSIS/MSI
  # on Windows, a universal .dmg on macOS) is already exercised by release.yml on
  # every push to main, so duplicating it here would only add ~20 minutes of
  # runner time per job for a signal we already have. What release.yml does NOT
  # cover is pull_request: it never runs on a PR, so today a broken packaging
  # script is only discovered after the merge, on main. This job runs on both
  # triggers and is the PR-side early warning — it packages the lumo CLI and
  # asserts an archive actually came out.
  #
  # The Linux deps are needed even without Tauri: cargo unifies features across
  # the workspace, so lumo-cli drags in lumo-actions' `desktop` feature
  # (rdev/x11, via pkg-config) and lumo-voice's `capture` feature (cpal/alsa).
  # Same composite action as the other Linux jobs, so the list cannot drift.
  #
  # package-cli.sh is left to fail on its own if it is broken — no `|| true`.
  # A smoke test that swallows the failure it exists to catch is worse than none.
  bundle-smoke:
    name: bundle smoke / cli archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps
      # Takes only [TARGET]; with no argument it builds for the host (x86_64
      # Linux) and writes dist/lumorpa-<version>-linux-<arch>.tar.gz plus the
      # .sha256 sidecar next to it.
      - name: Package CLI archive
        run: scripts/package-cli.sh
      # Assert at the JOB level, not just inside the script: this catches a
      # main-branch change to package-cli.sh's output naming or staging, or an
      # accidental `dist/` clean-up step, that the script's own checks cannot
      # see. -size +0 catches a truncated release build.
      - name: Assert the CLI archive is a usable deliverable
        run: |
          set -euo pipefail
          ls -l dist
          archive="$(find dist -maxdepth 1 -name 'lumorpa-*.tar.gz' -print -quit)"
          test -n "$archive" || { echo "error: no dist/lumorpa-*.tar.gz was produced" >&2; exit 1; }
          test -s "$archive" || { echo "error: $archive is empty" >&2; exit 1; }
          test -s "$archive.sha256" || { echo "error: $archive.sha256 is missing or empty" >&2; exit 1; }
          echo "OK: $archive ($(du -h "$archive" | cut -f1))"