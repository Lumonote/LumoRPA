[workspace]
resolver = "2"
members = [
    "crates/lumo-dsl",
    "crates/lumo-storage",
    "crates/lumo-core",
    "crates/lumo-actions",
    "crates/lumo-ai",
    "crates/lumo-recorder",
    "crates/lumo-skills",
    "crates/lumo-doc",
    "crates/lumo-agent",
    "crates/lumo-voice",
    "crates/lumo-cli",
    "apps/desktop/src-tauri",
]
default-members = ["crates/lumo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Raised 1.83 -> 1.88. The 1.83 floor was no longer truthful: the dependency
# tree already required more, and two of the blockers are not avoidable by
# pinning. Measured with `cargo +<v> check`, each of these is a hard floor:
#   * 1.85 — clap_lex 1.1.0 ships an edition-2024 manifest, which Cargo < 1.85
#     cannot even parse ("feature `edition2024` is required"), so the MSRV job
#     died while downloading rather than compiling.
#   * 1.86 — the icu_* 2.2.0 crates (normalization/data, via idna) declare
#     rust-version 1.86.
#   * 1.88 — suppaftp declares 1.88 on every release from 10.0.0 onward, and
#     RUSTSEC-2026-0271 (FTP CRLF command injection) is only fixed in >= 10.0.2.
#     Staying at 1.83 therefore meant shipping a known-exploitable FTP client.
# 1.88 is the smallest floor that satisfies all three simultaneously — not an
# arbitrary bump, and not a target we chose for its own sake. Revisit if any of
# clap_lex, icu_*, or suppaftp relaxes its requirement.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Lumonote/LumoRPA"
homepage = "https://lumorpa.io"
authors = ["LumoRPA Contributors"]

[workspace.dependencies]
# crypto
age             = "0.11"
rpassword       = "7"

# crates
lumo-dsl       = { path = "crates/lumo-dsl",       version = "0.1.0" }
lumo-storage   = { path = "crates/lumo-storage",   version = "0.1.0" }
lumo-core      = { path = "crates/lumo-core",      version = "0.1.0" }
lumo-actions   = { path = "crates/lumo-actions",   version = "0.1.0" }
lumo-ai        = { path = "crates/lumo-ai",        version = "0.1.0" }
lumo-recorder  = { path = "crates/lumo-recorder",  version = "0.1.0" }
lumo-skills    = { path = "crates/lumo-skills",    version = "0.1.0" }
lumo-doc       = { path = "crates/lumo-doc",       version = "0.1.0" }
lumo-agent     = { path = "crates/lumo-agent",     version = "0.1.0" }
lumo-voice     = { path = "crates/lumo-voice",     version = "0.1.0" }

# async + runtime
tokio           = { version = "1.40", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std", "sync", "time", "process", "signal"] }
async-trait     = "0.1"
futures         = "0.3"

# serde + dsl
# P1-3:TemplateCtx 字段 Arc 化后,serde 对 `Arc<T>` 的 (De)Serialize 实现需要 "rc"。
serde           = { version = "1", features = ["derive", "rc"] }
serde_json      = "1"
serde_yaml      = "0.9"
toml            = "0.8"
minijinja       = { version = "2.5", features = ["loader", "json"] }
schemars        = { version = "0.8", features = ["chrono", "uuid1"] }

# errors + logging
anyhow          = "1"
thiserror       = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# storage
rusqlite        = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
# T3 db 资源:PostgreSQL / MySQL。sqlx 0.8.6 锁定(0.9 起 MSRV 升到 1.94 > 本仓
# 1.83)。仅 rustls(ring 经 tls-rustls)——不引 native-tls/openssl/任何 C-TLS,
# 满足 aarch64 信创交叉编译(与 reqwest/lettre 同一套 rustls 范式)。运行期 SQL
# 走 query/query_as 字符串(非 query! 宏),故构建期无需 DATABASE_URL。
# uuid/bigdecimal:行→JSON 转换需显式解码 UUID/NUMERIC/DECIMAL 列(否则静默 null);
# bigdecimal 纯 Rust 任意精度,金额列不丢精度。
sqlx            = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "json", "chrono", "uuid", "bigdecimal"] }

# common
chrono          = { version = "0.4", features = ["serde"] }
cron            = "0.13"
chrono-tz       = "0.10"
notify          = { version = "6", default-features = false, features = ["macos_kqueue"] }
ulid            = { version = "1", features = ["serde"] }
sha2            = "0.10"
uuid            = { version = "1", features = ["v4", "serde"] }
dashmap         = "6"
once_cell       = "1"
parking_lot     = "0.12"

# cli
clap            = { version = "4", features = ["derive", "env"] }
indicatif       = "0.17"
colored         = "2"
comfy-table     = "7"

# email MIME 解析:mail-parser(Stalwart,纯 Rust,无 C 依赖,信创/交叉友好)。
# email.fetch 取回 BODY[] 原始字节后,用它解析 multipart 正文(text/html)与附件,
# 默认特性为空,显式开 full_encoding(经 encoding_rs,本仓已有)覆盖 GBK/GB18030
# 等中文字符集。注意:其传递依赖 hashify 自 0.2.7 起 edition 2024。该钉版起初
# 是为守 MSRV 1.83 而设;MSRV 已提到 1.88(见 workspace.package),edition 2024
# 不再是障碍,但 Cargo.lock 仍钉 hashify =0.2.6 —— 解开它需要单独验证,
# 不属本次改动范围,故暂不盲目 cargo update。
mail-parser     = { version = "0.11", features = ["full_encoding"] }

# MSRV 钉版(只动 Cargo.lock,同 hashify 先例):以下传递依赖的新版已转
# edition 2024,当初为守 MSRV 1.83 而钉住末个 edition 2021 版本。MSRV 现已
# 提到 1.88,edition 2024 不再是硬障碍 —— 这些钉版因此是"待清理"而非"必需",
# 但逐个解开需各自验证,故保留并不要在无关改动中盲目 cargo update ——
#   psm =0.1.26(lettre→chumsky→stacker;0.1.30 起 build-dep ar_archive_writer 0.5)
#   base64ct =1.6.0 / home =0.5.11 / idna_adapter =1.2.1(各自新版起 edition 2024)
#   proc-macro-crate =3.2.0(xcap→zbus 宏所需;3.3+ 经 toml_edit 0.25 拉 edition 2024 树)
# 注:apps/desktop/src-tauri(tauri 2.11)子树经 toml 1.x 强拉 edition 2024 的
# indexmap 2.14→hashbrown 0.17,无法钉回 —— 该 GUI 成员本就不受信创 MSRV 约束;
# 核心 crates 子图(含 lumo-actions --features desktop)现已随 MSRV 1.88 全面
# 支持 edition 2024,交叉编译仍按 aarch64/loongarch64 目标验证。

# xml.* 指令族:quick-xml 流式解析/转义(纯 Rust,无 C 依赖,信创红线)。
# 0.37 -> 0.41:0.37 受 RUSTSEC-2026-0194 / RUSTSEC-2026-0195 影响
# (重复属性名检查是二次运行时间、NsReader 的命名空间声明分配无上界,两者都可被
# 构造输入放大成 DoS)。修复线是 0.41.0,取之,MSRV 1.79 ≤ 本仓 1.88。
# 只替换五个预定义实体与数字字符引用,自定义/外部实体与 DTD 一律不展开
# —— XXE 在解析层面不可能发生,这一点不随版本变化。
quick-xml       = "0.41"

# http / browser / excel
# reqwest 的 socks 特性:http.* 的 proxy 支持 socks5://(0.12.23+ 由 reqwest
# 内置实现,不再经 tokio-socks,Cargo.lock 零新增依赖;纯 Rust 无 C 依赖,
# 信创/交叉友好);rustls-tls 同时提供 Identity::from_pem(mTLS 客户端证书)
# —— 严禁 native-tls(C 依赖,信创红线)。
reqwest         = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "socks"] }
axum            = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tower-http      = { version = "0.6", default-features = false, features = ["trace"] }
chromiumoxide   = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
# calamine 0.26 经 quick-xml 0.31 间接吃 RUSTSEC-2026-0194/0195(见 deny.toml
# 的精确抑制条目)。升级路径已被上游锁死,此处保持 0.26:
#   * calamine 0.36.x 才用 quick-xml ^0.41(唯一能修这两条的版本),但它同时
#     硬依赖 zip ^8.6,而 zip 8.x 全系列已被 yank(8.0.0~8.6.0),crates.io 上
#     仅剩 9.0.3 / 9.0.4 —— cargo update 直接报 failed to select a version for
#     the requirement `zip = "^8.6"`。
#   * calamine 0.31~0.35 分别停在 quick-xml ^0.38 / ^0.39,均低于 0.41 修复线,
#     且 minor 不兼容,无法在 lock 里强抬。
# 结论:这是上游版本组合造成的死结,不是本仓可单方面解决的。约束记录在此,
# 待 calamine 发布改用 zip 9 的版本后重估。
calamine        = "0.26"
rust_xlsxwriter = "0.79"
umya-spreadsheet = { version = "2.3.3", default-features = false }

# tests
pretty_assertions = "1"
tempfile        = "3"

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
