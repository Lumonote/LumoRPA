[workspace]
resolver = "2"
members = [
    "crates/lumo-dsl",
    "crates/lumo-storage",
    "crates/lumo-core",
    "crates/lumo-actions",
    "crates/lumo-ai",
    "crates/lumo-recorder",
    "crates/lumo-skills",
    "crates/lumo-cli",
    "apps/desktop/src-tauri",
]
default-members = ["crates/lumo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
repository = "https://github.com/lumorpa/lumorpa"
homepage = "https://lumorpa.io"
authors = ["LumoRPA Contributors"]

[workspace.dependencies]
# crypto
age             = "0.11"
rpassword       = "7"

# crates
lumo-dsl       = { path = "crates/lumo-dsl",       version = "0.1.0" }
lumo-storage   = { path = "crates/lumo-storage",   version = "0.1.0" }
lumo-core      = { path = "crates/lumo-core",      version = "0.1.0" }
lumo-actions   = { path = "crates/lumo-actions",   version = "0.1.0" }
lumo-ai        = { path = "crates/lumo-ai",        version = "0.1.0" }
lumo-recorder  = { path = "crates/lumo-recorder",  version = "0.1.0" }
lumo-skills    = { path = "crates/lumo-skills",    version = "0.1.0" }

# async + runtime
tokio           = { version = "1.40", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std", "sync", "time", "process", "signal"] }
async-trait     = "0.1"
futures         = "0.3"

# serde + dsl
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
serde_yaml      = "0.9"
toml            = "0.8"
minijinja       = { version = "2.5", features = ["loader", "json"] }
schemars        = { version = "0.8", features = ["chrono", "uuid1"] }

# errors + logging
anyhow          = "1"
thiserror       = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# storage
rusqlite        = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
# T3 db 资源:PostgreSQL / MySQL。sqlx 0.8.6 锁定(0.9 起 MSRV 升到 1.94 > 本仓
# 1.83)。仅 rustls(ring 经 tls-rustls)——不引 native-tls/openssl/任何 C-TLS,
# 满足 aarch64 信创交叉编译(与 reqwest/lettre 同一套 rustls 范式)。运行期 SQL
# 走 query/query_as 字符串(非 query! 宏),故构建期无需 DATABASE_URL。
# uuid/bigdecimal:行→JSON 转换需显式解码 UUID/NUMERIC/DECIMAL 列(否则静默 null);
# bigdecimal 纯 Rust 任意精度,金额列不丢精度。
sqlx            = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "json", "chrono", "uuid", "bigdecimal"] }

# common
chrono          = { version = "0.4", features = ["serde"] }
cron            = "0.13"
notify          = { version = "6", default-features = false, features = ["macos_kqueue"] }
ulid            = { version = "1", features = ["serde"] }
sha2            = "0.10"
uuid            = { version = "1", features = ["v4", "serde"] }
dashmap         = "6"
once_cell       = "1"
parking_lot     = "0.12"

# cli
clap            = { version = "4", features = ["derive", "env"] }
indicatif       = "0.17"
colored         = "2"
comfy-table     = "7"

# email MIME 解析:mail-parser(Stalwart,纯 Rust,无 C 依赖,信创/交叉友好)。
# email.fetch 取回 BODY[] 原始字节后,用它解析 multipart 正文(text/html)与附件,
# 默认特性为空,显式开 full_encoding(经 encoding_rs,本仓已有)覆盖 GBK/GB18030
# 等中文字符集。注意:其传递依赖 hashify 自 0.2.7 起 edition 2024(需 rustc
# ≥1.85 > 本仓 MSRV 1.83),Cargo.lock 已钉 hashify =0.2.6(edition 2021);
# 不要对 hashify 盲目 cargo update。
mail-parser     = { version = "0.11", features = ["full_encoding"] }

# xml.* 指令族:quick-xml 流式解析/转义(纯 Rust,无 C 依赖,信创红线)。
# 0.37 已是本仓传递依赖(Cargo.lock 0.37.5),不引入新版本树;edition 2021,
# MSRV 远低于本仓 1.83。quick-xml 只替换五个预定义实体与数字字符引用,自定义/
# 外部实体与 DTD 一律不展开 —— XXE 在解析层面不可能发生。
quick-xml       = "0.37"

# http / browser / excel
reqwest         = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
axum            = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tower-http      = { version = "0.6", default-features = false, features = ["trace"] }
chromiumoxide   = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
calamine        = "0.26"
rust_xlsxwriter = "0.79"
umya-spreadsheet = { version = "2.3.3", default-features = false }

# tests
pretty_assertions = "1"
tempfile        = "3"

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
